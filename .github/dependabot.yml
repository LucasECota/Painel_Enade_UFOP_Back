version: 2
updates:
  # avisa (com um pull request) quando uma dependência npm tem versão nova ou correção de segurança
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # mantém as ações do GitHub usadas no CI atualizadas
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
